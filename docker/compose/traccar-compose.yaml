services:

  database:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - traccar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - traccar-network

  traccar:
    image: ${TRACCAR_IMAGE:?TRACCAR_IMAGE is required}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PROTOCOLS_ENABLE: gt06,teltonika
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health" ]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
    ports:
      - "127.0.0.1:8082:8082"
      - "5023:5023/tcp" # GT06
      - "5027:5027/tcp" # Teltonika
    volumes:
      - traccar-logs:/opt/traccar/logs
    networks:
      - traccar-network

volumes:
  traccar-data:
  traccar-logs:

networks:
  traccar-network:
    driver: bridge
